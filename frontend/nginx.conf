# La interfaz y el reenvio a la API, en el MISMO ORIGEN.
#
# Que `/catastro/api/v1` se sirva desde aqui no es comodidad: el backend de este
# repositorio **no tiene ninguna configuracion de CORS** —cero ocurrencias de
# `cors` y de `allowedOrigins` en todo `backend/`—, asi que un React servido desde
# otro origen se queda bloqueado por el navegador antes de que el backend conteste
# nada. Esto es lo unico que hace que la interfaz alcance la API.
#
# La alternativa seria abrir CORS en el backend, y es de las cosas que se ponen
# «temporalmente» y se quedan: una vez abierto, quien lo cierra tiene que
# demostrar que nadie dependia de el.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # La aplicacion resuelve sus rutas en el navegador —viven en el hash,
    # `#/catastro/predios`— asi que cualquier ruta que no sea un archivo devuelve
    # `index.html`. Sin esto, recargar en una ruta que no existe como archivo da
    # un 404 de nginx en vez de la pantalla.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # `catastro` es el nombre del servicio de la aplicacion en `despliegue/compose.yaml`.
    location /catastro/api/v1/ {
        proxy_pass http://catastro:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Los archivos con huella en el nombre no cambian nunca; `index.html` si. Sin
    # esta pareja el navegador decide por su cuenta, y entonces unas veces vuelve a
    # descargar activos con huella que no cambian y otras se queda con un
    # `index.html` viejo que apunta a activos que ya no existen.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}

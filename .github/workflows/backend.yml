# Verificacion del backend de `catastro`. Lo que este workflow ejecuta son las dos barreras
# bloqueantes del corte, sin atajos:
#
#   ./gradlew verificarAislamiento    aislamiento multi-tenant. Requiere Docker.
#   ./gradlew verificarArquitectura   ArchUnit, escaner de fuentes, aserciones y frontera de sistema.
#
# Van en PASOS SEPARADOS a proposito, aunque una sola invocacion pudiera correr las dos: cuando algo
# se rompe, el nombre del paso ya dice que barrera cayo. Es el mismo reparto que
# `sgtm/.github/workflows/backend.yml`, y esta copiado con su comentario para que no se pierda al
# separarse los repositorios.
#
# Las pruebas de persistencia NO se omiten sin Docker: fallan. Una verificacion bloqueante que se
# salta a si misma deja el build en verde sin haber verificado nada, que es peor que no tenerla.
#
# Y las barreras viven en `infrastructure/librerias-backend`, que se consume como composite build:
# por eso este workflow hace checkout de DOS repositorios. Sin el segundo, `settings.gradle.kts` se
# para diciendo que falta, que es mejor que un fallo de Gradle sobre un directorio inexistente.

name: Backend

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verificar:
    name: Verificaciones bloqueantes
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Este repositorio
        uses: actions/checkout@v4
        with:
          path: catastro

      # El composite build de las barreras. `settings.gradle.kts` lo busca en
      # `../../infrastructure/librerias-backend`, asi que los dos clones tienen que quedar
      # hermanos: por eso el `path` de arriba y el de aqui.
      - name: Las librerias comunes de backend
        uses: actions/checkout@v4
        with:
          repository: hneyra/infrastructure
          path: infrastructure
          # Los cinco repositorios del producto son PRIVADOS y el `GITHUB_TOKEN` solo
          # alcanza al suyo: sin esto, `Not Found` al pedir la rama por omision.
          token: ${{ secrets.GH_CLONE_KEY || github.token }}

      # Lo que este sistema lee del clon de «rentas», que son DOS cosas y no una (P6, ADR-0030 §4):
      #
      #   docs/50-api/contratos-que-consume   lo que `rentas` le pide a este sistema.
      #                                       `ContratoConElConsumidorTestBase` lo lee del clon
      #                                       hermano y **se niega a saltarse**: una prueba de
      #                                       contrato que no encuentra su contrato y pasa en verde
      #                                       es peor que ninguna.
      #   infra/carga-de-datos/ejemplos       el padron de demostracion contra el que
      #                                       `ArchivosDeEjemploTest` cruza los titulares de
      #                                       `fichas.csv` (P5C). Tampoco estaba, y no se veia
      #                                       porque el paso de aislamiento moria antes (C-21).
      #   docs/50-api/anti-entropia           los vectores de oro de la huella. Los publica `rentas`
      #                                       y este repositorio los REPRODUCE con su propia
      #                                       implementacion (`VectoresDeHuellaTest`); si dejan de
      #                                       coincidir, la comparacion de sectores da todo
      #                                       discrepante o nada discrepante, y las dos cosas se
      #                                       leen como un problema de datos siendo de codigo.
      #
      # El segundo faltaba, y por eso este workflow llevaba rojo desde que se anadio esa prueba: la
      # lista de aqui se escribio cuando solo existia el primero y nada la ata a lo que los tests
      # leen de verdad. Eso lo cierra ahora `ClonesHermanosDelWorkflowTest`, que deriva las rutas
      # de las propias clases de prueba y exige que esta lista las cubra.
      #
      # Sigue siendo `sparse-checkout` y no el clon entero: `rentas/docs/50-api` pesa 1,1 MB —casi
      # todo prototipo y OpenAPI— y traerlo por dos archivos seria pagar el clon de otro sistema en
      # cada corrida.
      - name: Traer lo que publica «rentas»
        uses: actions/checkout@v4
        with:
          repository: hneyra/rentas
          path: rentas
          # Los cinco repositorios del producto son PRIVADOS y el `GITHUB_TOKEN` solo
          # alcanza al suyo: sin esto, `Not Found` al pedir la rama por omision.
          token: ${{ secrets.GH_CLONE_KEY || github.token }}
          sparse-checkout: |
            docs/50-api/contratos-que-consume
            docs/50-api/anti-entropia
            infra/carga-de-datos/ejemplos
          sparse-checkout-cone-mode: false

      # Lo que este sistema lee del clon de «normativa»: DOS archivos, y los dos por el mismo motivo
      # —una copia de una cifra normativa es un segundo sitio donde puede estar mal—, asi que el
      # clon tiene que venir.
      #
      #   fuentes/valores-unitarios-2026   el cuadro derivado del Anexo I.2, con el que
      #                                    `ElPadronDeDemostracionSeValorizaTest` valoriza los 23
      #                                    predios del padron de demostracion (#8).
      #   publicacion/parametros-2026.csv  el derivado publicable, del que ese mismo censo lee el
      #                                    «% actualizacion» SELLADO en vez de escribirlo aqui. Esa
      #                                    llave ya estuvo publicada una vez con una firma que nadie
      #                                    puso y volvio a salir del derivado cuando la direccion lo
      #                                    rechazo: un cero escrito en la prueba habria dejado el
      #                                    censo diciendo «4 de 23» durante todo ese intervalo,
      #                                    cuando la respuesta real era «0 de 23».
      #
      # Faltaba desde que #8 aterrizo en `beta`, y el rojo que producia no hablaba de su causa:
      # «Falta el clon hermano de `normativa`» en el paso de `build`. `ClonesHermanosDelWorkflowTest`
      # no lo cazo porque la ruta se componia en trozos, que es su falso negativo declarado; ahora
      # esa prueba la escribe en un solo literal y esta guarda si la ve.
      #
      # El `ref` NO es decorativo, y la regla que expresa es general: UN PR CONTRA UNA RAMA TRAE ESA
      # MISMA RAMA DEL HERMANO; todo lo demas trae `main`. Lo que compra es que una tanda que se
      # integra en una rama compartida se mida contra el estado de esa tanda, y no contra `main`.
      #
      # Mientras la etapa 1 se integro en `beta` —en los cinco repositorios a la vez—, la
      # consecuencia querida era que un PR de `beta` a `main` se pusiera ROJO hasta que `normativa`
      # fusionara el suyo. Funciono: paso exactamente eso, se respeto el orden y el rojo desaparecio
      # solo cuando `normativa` mezclo primero.
      #
      # HOY `beta` YA NO EXISTE: se borro al mezclar la etapa 1. Medido con
      # `git ls-remote --heads origin beta`, da CERO en `catastro`, en `rentas` y en
      # `infrastructure`; de `normativa` y `caja` no se midio aqui, y lo que si consta es que
      # `normativa` fusiono su etapa 1 ANTES que este repositorio. Asi que esta expresion resuelve
      # hoy a `main` —que es lo correcto, porque ahi esta el cuadro— y el condicional se conserva
      # porque la etapa 2 puede volver a integrarse en una rama compartida (#16).
      #
      # Y queda dicha la trampa, que es lo unico que este condicional puede hacer mal: si alguien
      # recrea `beta` AQUI y no en `normativa`, el checkout pide una rama que alli no existe y falla
      # con «Not Found» — un error que no habla de su causa. Recrear `beta` es recrearla en los
      # cinco, o en ninguno.
      - name: Traer el cuadro que firma «normativa»
        uses: actions/checkout@v4
        with:
          repository: hneyra/normativa
          path: normativa
          ref: ${{ (github.base_ref || github.ref_name) == 'beta' && 'beta' || 'main' }}
          # Los cinco repositorios del producto son PRIVADOS y el `GITHUB_TOKEN` solo
          # alcanza al suyo: sin esto, `Not Found` al pedir la rama por omision.
          token: ${{ secrets.GH_CLONE_KEY || github.token }}
          sparse-checkout: |
            docs/10-negocio/valores-normativos/fuentes/valores-unitarios-2026
            docs/10-negocio/valores-normativos/publicacion/parametros-2026.csv
          sparse-checkout-cone-mode: false

      # ADR-0001 fija Java 25. Se comprueba en vez de suponerse: si alguien cambiara la propiedad,
      # CI verificaria en silencio una version de Java distinta de la que se despliega.
      - name: La version de Java declarada es la que instala CI
        working-directory: catastro/backend
        run: |
          declarada=$(sed -n 's/^kamayuk\.java\.version=//p' gradle.properties)
          if [ "$declarada" != "25" ]; then
            echo "::error file=backend/gradle.properties::gradle.properties declara Java $declarada y este workflow instala Java 25."
            exit 1
          fi

      - name: Instalar JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      # El wrapper descarga la distribucion de services.gradle.org, que devuelve 502 de vez en
      # cuando. Sin este paso, ese 502 aparece como un build rojo indistinguible de un fallo real,
      # y la reaccion natural —relanzar— acaba normalizando el relanzamiento como respuesta a
      # cualquier rojo.
      - name: Descargar la distribucion de Gradle, con reintentos
        working-directory: catastro/backend
        run: |
          for intento in 1 2 3 4; do
            if ./gradlew --version; then exit 0; fi
            echo "Intento $intento fallido; se reintenta en $((intento * 10))s"
            sleep $((intento * 10))
          done
          echo "No se pudo descargar la distribucion de Gradle tras cuatro intentos"
          exit 1

      # Por el mismo motivo: sin esto, un runner sin Docker o un registro caido salen en rojo como
      # si fueran un fallo de aislamiento, y el rojo que mas importa del proyecto es justo el que no
      # puede confundirse con otra cosa.
      - name: Docker y la imagen de PostgreSQL
        run: |
          if ! docker info > /dev/null 2>&1; then
            echo "::error::Sin Docker no hay prueba de aislamiento. La salida documentada es apuntar a un PostgreSQL existente con -Dkamayuk.pruebas.postgres.url; omitir la prueba no lo es."
            exit 1
          fi
          docker pull postgis/postgis:16-3.4-alpine

      - name: Aislamiento multi-tenant
        working-directory: catastro/backend
        run: ./gradlew verificarAislamiento --no-daemon

      - name: Arquitectura, escaner de fuentes y frontera de sistema
        working-directory: catastro/backend
        run: ./gradlew verificarArquitectura --no-daemon

      - name: Build completo
        working-directory: catastro/backend
        run: ./gradlew build --no-daemon

      - name: Publicar los informes de prueba
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: informes-de-prueba
          path: catastro/backend/**/build/reports/tests/**
          if-no-files-found: ignore
          retention-days: 7

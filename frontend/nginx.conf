# `catastro-web`, servido como archivos estaticos. Y NADA MAS: aqui no hay reenvio a la API.
#
# <h2>Lo que este archivo YA NO tiene, y por que se fue</h2>
#
# Hasta la interfaz desplegada, aqui habia un `location /catastro/api/v1/` con
# `proxy_pass http://catastro:8080`. Ese nombre es el del servicio del `compose.yaml`, y en
# Kubernetes **no existe ningun `Service` que se llame «catastro»**: el del backend se llama
# `kamayuk-catastro-web`. No es un 502 tardio, es peor: **nginx resuelve el anfitrion de un
# `proxy_pass` AL ARRANCAR**, asi que el contenedor sale con codigo 1 y esto en su registro
#
#     [emerg] host not found in upstream "catastro" in /etc/nginx/conf.d/default.conf:30
#
# O sea que el pod no arranca, y el mensaje habla de nginx y no del manifiesto. Ni `pulumi up`
# ni la auditoria del descriptor lo predicen. Lo tiene medido `infrastructure` en
# `infra/verificaciones/upstream-de-la-interfaz.ts`, que existe por este archivo.
#
# <h2>Y por que no se arregla cambiando el nombre del upstream</h2>
#
# Porque el problema que el reenvio resolvia **se resuelve un piso mas arriba**. Es real —esta
# medido que el backend no publica ni una cabecera `Access-Control-Allow-Origin`: cero
# `CorsConfiguration` y cero `@CrossOrigin` en todo `backend/`— pero quien pone la interfaz y la
# API en el MISMO ORIGEN es el ingreso: `infrastructure/src/descriptor.ts` parte la ruta en dos
# —`/catastro/api/v1` al backend y `/catastro` a esta interfaz— dentro del mismo `Host`. Desde el
# navegador todo cuelga de un solo origen, que es exactamente lo que el reenvio conseguia.
#
# Hacerlo aqui ADEMAS seria peor que redundante: habria **dos** caminos a la API —uno por Traefik
# y otro por dentro de este contenedor— y el dia que difieran, la mitad de las peticiones iria por
# un sitio que nadie revisa. Y obligaria a este contenedor a alcanzar al backend por la red, que es
# justo lo que su `NetworkPolicy` le niega a proposito: una interfaz que solo sirve archivos no
# necesita hablar con nadie.
#
# <h2>Por que aqui se sirve en la RAIZ aunque de puertas afuera viva bajo `/catastro`</h2>
#
# El ingreso quita el prefijo (`stripPrefix`), asi que a este nginx las peticiones le llegan ya sin
# el: el navegador pide `/catastro/assets/index-<huella>.js` y aqui entra `/assets/index-<huella>.js`.
# Que el paquete pida esa ruta con el prefijo lo garantiza `vite.config.ts` con `base: '/catastro/'`,
# que esta puesto por ADR-0030 §2 — el mismo Traefik sirve las cinco interfaces, y con la base en la
# raiz este paquete pediria `/assets/…`, que en el cluster es de otro sistema.
#
# <h2>El «200 que miente», que es el modo de fallo que este archivo hace ruidoso</h2>
#
# `try_files $uri /index.html` convierte cualquier ruta que no sea un archivo en la pantalla, con un
# **200**. Es lo que hace falta para que recargar en `#/catastro/predios` funcione, y es tambien la
# forma mas silenciosa de romper un despliegue: si el ingreso deja de quitar el prefijo, el navegador
# pide un `.js` y recibe **HTML con codigo de exito**. No un error: una pagina. El sintoma es una
# pantalla en blanco y en la consola «Unexpected token '<'».
#
# Por eso el ultimo bloque contesta 404 **diciendo la causa** ante cualquier ruta que llegue con el
# prefijo puesto: aqui dentro eso no puede pasar nunca, y si pasa, el `stripPrefix` del ingreso no
# esta haciendo su trabajo.
#
# <h2>Las cabeceras van REPETIDAS en cada bloque, y no es descuido</h2>
#
# `add_header` NO se hereda a un `location` que declara sus propios `add_header`: nginx toma el
# conjunto del nivel mas interno que tenga alguno y descarta el de arriba entero.
#
# Medido en `nginx:1.31.5-alpine`: con las tres cabeceras escritas SOLO a nivel de `server`,
# `wget -S` sobre `/` y sobre `/assets/index-*.js` no devuelve ninguna —cero de tres, en las dos
# rutas—. O sea que el arreglo obvio es un cambio que parece correcto, pasa una revision de lectura
# y **no hace absolutamente nada**. Por eso se escriben abajo, dentro de cada bloque, y por eso este
# parrafo esta aqui: quien las mueva «para no repetirlas» las apaga sin que nada lo diga.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # La aplicacion resuelve sus rutas en el navegador —viven en el hash,
    # `#/catastro/predios`— asi que cualquier ruta que no sea un archivo devuelve
    # `index.html`. Sin esto, recargar en una ruta que no existe como archivo da
    # un 404 de nginx en vez de la pantalla.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los archivos con huella en el nombre no cambian nunca; `index.html` si. Sin
    # esta pareja el navegador decide por su cuenta, y entonces unas veces vuelve a
    # descargar activos con huella que no cambian y otras se queda con un
    # `index.html` viejo que apunta a activos que ya no existen.
    location /assets/ {
        # `expires 1y` ya emite `Cache-Control: max-age=31536000`; lo de al lado
        # solo anade `immutable`, que es lo que evita la revalidacion al recargar.
        expires 1y;
        add_header Cache-Control "public, immutable";

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";

        # Las tres, otra vez. Ver el parrafo de arriba: no se heredan.
        #
        #   · `nosniff` — sin ella, un navegador puede decidir por su cuenta que
        #     un archivo servido con un tipo es otra cosa y ejecutarlo.
        #   · `DENY` — esta interfaz no se embebe en ningun sitio. El token de
        #     sesion vive en MEMORIA y no en `localStorage` desde la puerta de
        #     identidad, pero eso no quita el riesgo: dentro de un marco ajeno, un
        #     clic sobre un boton que no se ve es un clic de quien tiene la sesion
        #     abierta, y la sesion esta abierta mientras la pestana lo este.
        #   · `no-referrer` — la aplicacion solo habla con su propio origen y con
        #     el emisor OIDC, asi que no hay ningun destino al que la direccion de
        #     esta pagina —que lleva el predio que se estaba mirando en el hash—
        #     tenga que llegar.
        #
        # NO hay `Content-Security-Policy`, y se dice en vez de descubrirse: las
        # pantallas llevan los estilos EN LINEA —`style={{…}}` de React—, asi que
        # una politica util exigiria decidir `style-src` y medirla contra la
        # interfaz entera, que es otro trabajo.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # ── Las senias del ambiente ──────────────────────────────────────────────
    #
    # `no-store` y no `no-cache`: este archivo lo REEMPLAZA el `ConfigMap` al desplegar
    # —la imagen trae uno vacio— y un navegador que se quedara con el anterior mandaria
    # al usuario al emisor OIDC de otro ambiente. El sintoma seria un rebote a un
    # Keycloak que desde ese puesto no existe, con la interfaz perfectamente sana.
    # Ver `src/api/configuracion.ts`.
    location = /configuracion.js {
        add_header Cache-Control "no-store" always;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # ── La averia del prefijo, dicha en voz alta ─────────────────────────────
    #
    # Ver «el 200 que miente». Aqui dentro nunca hay rutas que empiecen por `/catastro/`:
    # el ingreso quita ese prefijo antes de reenviar. Si aparece una, la configuracion del
    # ingreso esta mal y esto lo dice, en vez de servir el `index.html` con un 200 y dejar
    # que el sintoma aparezca en la consola del navegador de otra persona.
    location /catastro/ {
        # `types { }` vacia el mapa de extensiones para este bloque, y hace falta: sin el,
        # nginx deduce el tipo del `.js` de la URI y este mensaje —que es prosa— sale
        # etiquetado `application/javascript`. Con el mapa vacio manda `default_type`.
        types { }
        default_type text/plain;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;

        return 404 "El ingreso no quito el prefijo /catastro. Esta interfaz se sirve en la raiz del contenedor: revisa el middleware stripPrefix del IngressRoute.\n";
    }
}

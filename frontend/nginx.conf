# La interfaz y el reenvio a la API, en el MISMO ORIGEN.
#
# Que `/catastro/api/v1` se sirva desde aqui no es comodidad: el backend de este
# repositorio **no tiene ninguna configuracion de CORS** —cero ocurrencias de
# `cors` y de `allowedOrigins` en todo `backend/`—, asi que un React servido desde
# otro origen se queda bloqueado por el navegador antes de que el backend conteste
# nada. Esto es lo unico que hace que la interfaz alcance la API.
#
# La alternativa seria abrir CORS en el backend, y es de las cosas que se ponen
# «temporalmente» y se quedan: una vez abierto, quien lo cierra tiene que
# demostrar que nadie dependia de el.

# <h2>Las cabeceras van REPETIDAS en cada bloque, y no es descuido</h2>
#
# `add_header` NO se hereda a un `location` que declara sus propios `add_header`:
# nginx toma el conjunto del nivel mas interno que tenga alguno y descarta el de
# arriba entero. Aqui hay dos bloques con los suyos —`/assets/` y `= /index.html`—
# y `location /` sirve a traves de un redireccion interno a `/index.html`, de modo
# que **todas** las respuestas caen en uno de esos dos.
#
# Medido en `nginx:1.31.5-alpine`: con las tres cabeceras escritas SOLO a nivel de
# `server`, `wget -S` sobre `/` y sobre `/assets/index-*.js` no devuelve ninguna
# —cero de tres, en las dos rutas—. O sea que el arreglo obvio es un cambio que
# parece correcto, pasa una revision de lectura y **no hace absolutamente nada**.
# Por eso se escriben abajo, dentro de cada bloque, y por eso este parrafo esta
# aqui: quien las mueva «para no repetirlas» las apaga sin que nada lo diga.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # La aplicacion resuelve sus rutas en el navegador —viven en el hash,
    # `#/catastro/predios`— asi que cualquier ruta que no sea un archivo devuelve
    # `index.html`. Sin esto, recargar en una ruta que no existe como archivo da
    # un 404 de nginx en vez de la pantalla.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # `catastro` es el nombre del servicio de la aplicacion en `despliegue/compose.yaml`.
    location /catastro/api/v1/ {
        proxy_pass http://catastro:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Los archivos con huella en el nombre no cambian nunca; `index.html` si. Sin
    # esta pareja el navegador decide por su cuenta, y entonces unas veces vuelve a
    # descargar activos con huella que no cambian y otras se queda con un
    # `index.html` viejo que apunta a activos que ya no existen.
    location /assets/ {
        # `expires 1y` ya emite `Cache-Control: max-age=31536000`; lo de al lado
        # solo anade `immutable`, que es lo que evita la revalidacion al recargar.
        expires 1y;
        add_header Cache-Control "public, immutable";

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";

        # Las tres, otra vez. Ver el parrafo de arriba: no se heredan.
        #
        #   · `nosniff` — sin ella, un navegador puede decidir por su cuenta que
        #     un archivo servido con un tipo es otra cosa y ejecutarlo.
        #   · `DENY` — esta interfaz no se embebe en ningun sitio, y el token de
        #     sesion vive en `localStorage` del mismo origen: dentro de un marco
        #     ajeno, un clic sobre un boton que no se ve es un clic de quien tiene
        #     la sesion abierta.
        #   · `no-referrer` — la aplicacion solo habla con su propio origen, asi
        #     que no hay ningun destino al que la direccion de esta pagina —que
        #     lleva el predio que se estaba mirando en el hash— tenga que llegar.
        #
        # NO hay `Content-Security-Policy`, y se dice en vez de descubrirse: las
        # pantallas llevan los estilos EN LINEA —`style={{…}}` de React—, asi que
        # una politica util exigiria decidir `style-src` y medirla contra la
        # interfaz entera, que es otro trabajo.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }
}

# ============================================================================
#  CATASTRO, LEVANTADO CONTRA LA PLATAFORMA (ADR-0031 §4, C-18)
#
#  Solo lo de este sistema: su migrador, su implantacion y su backend. NO trae
#  PostgreSQL ni Keycloak — los usa, y los levanta el compose de la plataforma,
#  que vive en el clon hermano `infrastructure`:
#
#      docker compose -f ../infrastructure/despliegue/plataforma.compose.yaml up -d --wait
#      docker compose -f despliegue/compose.yaml up --build --wait
#
#  ESTE ARCHIVO Y EL DESCRIPTOR TIENEN QUE DECIR LO MISMO. Es la trampa que
#  ADR-0011 anoto —«dos formas de levantar el sistema, que se separen, que una
#  variable nueva entre en el cluster y no en el compose»— y con cuatro sistemas
#  se multiplica por cuatro. Lo que lo sujeta es una guarda de `infrastructure`,
#  `infra/verificaciones/compose-de-los-sistemas.test.ts`, que lee este archivo y
#  `infrastructure/src/descriptor.ts` y compara las dos mitades: los nombres de
#  las variables de entorno de cada proceso, la base a la que apunta cada uno, el
#  rol con que se conecta, el prefijo de la ruta y los dos objetivos del
#  Dockerfile. No se copia una lista a mano: se derivan las dos y se comparan.
#
#
#  LO QUE ESTE COMPOSE NO TRAE, Y SE DICE EN VEZ DE DESCUBRIRSE: los DOS `CronJob`
#  que `lotes()` del descriptor declara —el publicador del padron, en su ventana
#  de madrugada, y el consumidor del buzon de `identidad`, cada cinco minutos
#  (ADR-0039 etapa 4)—. Aqui no hay temporizador que los dispare —el perfil
#  `batch` TERMINA el proceso, asi que un servicio mas seria un contenedor que
#  sale con codigo 0 y al que Compose reiniciaria en bucle, que es el defecto 5
#  de C-17—. Lo que si corre es la ULTIMA PASADA del consumidor: la implantacion
#  termina con ella, y por eso `catastro-implantacion` lleva las seis variables
#  del consumidor. Para volver a correrla a mano, con la municipalidad ya creada:
#
#      docker compose run --rm -e KAMAYUK_IDENTIDAD_CONSUMIDOR_MUNICIPALIDAD=1 \
#          catastro-implantacion
#
#  Queda como hueco declarado de C-18 lo que no cambia: el publicador del padron
#  no se dispara desde aqui (`PublicarElPadron` necesita
#  `KAMAYUK_CATASTRO_PUBLICACION_MUNICIPALIDAD`).
#  AQUI NO HAY FRONTEND, y no es un olvido. Este repositorio no tiene todavia
#  `frontend/`: ADR-0030 §1 decide que habra uno por sistema y hoy no existe
#  ninguno de los cuatro. El `README.md` de `infrastructure/despliegue/` decia
#  que este compose traia «su backend y su frontend»; se corrigio a lo que hay.
# ============================================================================

name: kamayuk-catastro

services:
  # ── El migrador, que corre y termina ────────────────────────────────────────
  #
  # La imagen del MIGRADOR, no la de la aplicacion (C-14, punto 1): son dos
  # objetivos del mismo `Dockerfile` y estan separados porque las credenciales de
  # `kamayuk_owner` —el unico rol con DDL— existen durante la migracion y desaparecen
  # con ella. Meterlas en la imagen de la aplicacion le daria DDL sobre el padron
  # a un proceso de larga vida expuesto en HTTP (ARQ-03 §4).
  #
  # Lee `KAMAYUK_DB_OWNER_USUARIO` y `KAMAYUK_DB_OWNER_CLAVE`, y NO `KAMAYUK_DB_USUARIO`:
  # lo dice el `main` de `kamayuk.catastro.esquema.Migrador`, que rechaza
  # argumentos a proposito para que una clave no quede en el historial del proceso.
  catastro-migraciones:
    build:
      # El contexto es la RAIZ del repositorio, no `backend/`: el `.dockerignore`
      # que lo acota vive alli y desde `backend/` no se aplica.
      context: ..
      dockerfile: backend/Dockerfile
      target: migrador
    image: kamayuk-catastro-migrador:compose
    environment:
      # `base` es el servicio del compose de la plataforma, no `postgres`. En el
      # cluster es otro nombre y lo entrega el entorno (C-17, punto 1): el
      # descriptor pide `e.plataforma.motor` en vez de escribirlo. Lo que si es de
      # este sistema —y por eso coincide en los dos— es el nombre de SU base.
      KAMAYUK_DB_URL: jdbc:postgresql://base:5432/catastro
      KAMAYUK_DB_OWNER_USUARIO: kamayuk_owner
      KAMAYUK_DB_OWNER_CLAVE: ${KAMAYUK_CLAVE_OWNER:?falta KAMAYUK_CLAVE_OWNER, sale del .env de la plataforma}
    # Corre y termina. Si se reinicia vuelve a comprobar el ambiente y no aplica
    # nada: el migrador es idempotente y tiene su prueba que lo demuestra.
    restart: "no"

  # ── La implantacion: la fila de `municipalidad` en SU base ───────────────────
  #
  # La MISMA imagen que la aplicacion con el perfil `batch` (ADR-0003: un
  # artefacto, dos perfiles), asi que no abre ningun puerto y termina al acabar.
  #
  # En el cluster el migrador va de `initContainer` de este Job, porque un
  # `Deployment` no sabe esperar a un `Job` y Kubernetes no tiene `dependsOn`.
  # Aqui `depends_on: service_completed_successfully` es exactamente esa espera, y
  # por eso el orden se expresa como dependencia y no repitiendo el migrador.
  catastro-implantacion:
    build:
      context: ..
      dockerfile: backend/Dockerfile
      target: aplicacion
    image: kamayuk-catastro:compose
    depends_on:
      catastro-migraciones:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: batch
      KAMAYUK_DB_URL: jdbc:postgresql://base:5432/catastro
      # `kamayuk_app` y solo `kamayuk_app`: sin DDL, sin BYPASSRLS, sin DELETE y
      # propietario de nada.
      KAMAYUK_DB_USUARIO: kamayuk_app
      KAMAYUK_DB_CLAVE: ${KAMAYUK_CLAVE_APP:?falta KAMAYUK_CLAVE_APP, sale del .env de la plataforma}
      # El prefijo es `kamayuk.implantacion`, y desde R-A/B lo es en los cuatro. Hasta
      # entonces `rentas` leia `sgtm.implantacion` —era el monolito— y la asimetria dejo
      # SU Job de implantacion saliendo con codigo 0 sin implantar nada (C-18 §5). Lo que
      # impide ahora apuntar esta implantacion con las variables de otro no es que el
      # nombre difiera, sino la guarda que compara cada descriptor con SU Java.
      KAMAYUK_IMPLANTACION_UBIGEO: ${KAMAYUK_UBIGEO:?falta KAMAYUK_UBIGEO en el .env de la plataforma}
      KAMAYUK_IMPLANTACION_NOMBRE: ${KAMAYUK_MUNICIPALIDAD:?falta KAMAYUK_MUNICIPALIDAD en el .env de la plataforma}
      KAMAYUK_IMPLANTACION_TIPO: ${KAMAYUK_TIPO_DE_MUNICIPALIDAD:-DISTRITAL}
      # La cuenta TIENE que ser la misma que el usuario de Keycloak: es lo unico
      # que une la fila de `usuario` con la identidad del token (ADR-0005).
      KAMAYUK_IMPLANTACION_ADMINISTRADOR: ${KAMAYUK_ADMINISTRADOR:?falta KAMAYUK_ADMINISTRADOR (ver identidad/datos-de-implantacion.sh)}
      KAMAYUK_IMPLANTACION_NOMBREDELADMINISTRADOR: ${KAMAYUK_NOMBRE_DEL_ADMINISTRADOR:-Administrador del sistema}
      # Por omision `true`, al reves que en el codigo: aqui se levanta una marcha
      # blanca, y mientras D-02a siga abierta toda cifra sale de parametros que
      # nadie ha firmado. Solo se aplica al ALTA.
      KAMAYUK_IMPLANTACION_ESDEMOSTRACION: ${KAMAYUK_ES_DEMOSTRACION:-true}
      KAMAYUK_IMPLANTACION_URL: jdbc:postgresql://base:5432/catastro
      # OWNERCLAVE sin guion bajo: en una variable de entorno el `_` se traduce a
      # punto, asi que `KAMAYUK_IMPLANTACION_OWNER_CLAVE` seria
      # `kamayuk.implantacion.owner.clave` y no `owner-clave`.
      KAMAYUK_IMPLANTACION_OWNERCLAVE: ${KAMAYUK_CLAVE_OWNER:?falta KAMAYUK_CLAVE_OWNER, sale del .env de la plataforma}
      # ── El consumidor del buzon de `identidad` (ADR-0039, etapa 4) ────────────
      #
      # La implantacion TERMINA con una pasada del consumidor, asi que lleva sus seis
      # variables, las mismas que el `CronJob` del descriptor. Son las que la guarda
      # de `infrastructure` compara con `lotes()`/`implantacion()`.
      #
      # `identidad-sistema` y NO `identidad`: en la red `kamayuk-plataforma` el alias
      # `identidad` lo tiene Keycloak, y el backend de `identidad` se registra como
      # `identidad-sistema` a proposito —con dos contenedores bajo el mismo alias el
      # DNS de Docker reparte y todo token seria invalido de forma intermitente—.
      KAMAYUK_IDENTIDAD_URL: http://identidad-sistema:8080
      # El punto de emision INTERNO de Keycloak, que aqui SI es `identidad`.
      KAMAYUK_IDENTIDAD_TOKEN: http://identidad:8080/realms/kamayuk/protocol/openid-connect/token
      # El cliente confidencial de este sistema y esta municipalidad (#21, ADR-0028 §2).
      KAMAYUK_IDENTIDAD_CLIENTE: kamayuk-catastro-servicio-${KAMAYUK_UBIGEO:?falta KAMAYUK_UBIGEO en el .env de la plataforma}
      # Su clave. VACIA por omision, a proposito: aqui la identidad de servicio hay que
      # crearla a mano (`reconciliar-identidades.sh servicios`), y mientras no exista lo
      # correcto es que la llamada salga sin credencial y `identidad` la rechace —no que
      # la implantacion se pase la vida pidiendo tokens que nadie va a dar—.
      #
      # LO QUE ESO SIGNIFICA CAMBIA EN LA ETAPA 5 DE ADR-0039, y hay que decirlo: desde
      # que la implantacion dejo de sembrar el administrador, ese rechazo NO deja una
      # base a medias que ya funciona — deja una base con su catalogo sembrado y CERO
      # usuarios. Asi que `catastro-implantacion` FALLA nombrando el remedio en vez de
      # salir con codigo 0. El orden para levantar esto es: la plataforma, `identidad`
      # implantado, `reconciliar-identidades.sh servicios`, y despues este compose.
      KAMAYUK_IDENTIDAD_CREDENCIAL: ${KAMAYUK_CATASTRO_CREDENCIAL_DE_IDENTIDAD:-}
      # A quien se le avisa cuando un evento no se pudo aplicar (ADR-0026 §4). Del
      # ambiente: son las mismas dos variables que `caja` lleva para la conciliacion.
      KAMAYUK_IDENTIDAD_RESPONSABLE: ${KAMAYUK_RESPONSABLE_DE_OPERACION:?falta KAMAYUK_RESPONSABLE_DE_OPERACION en el .env de la plataforma}
      KAMAYUK_IDENTIDAD_CANAL: ${KAMAYUK_CANAL_DE_OPERACION:?falta KAMAYUK_CANAL_DE_OPERACION en el .env de la plataforma}
      #
      # Y AQUI NO ESTA `KAMAYUK_IDENTIDAD_CONSUMIDOR_MUNICIPALIDAD`, que el `CronJob` del
      # descriptor SI declara. No es un olvido y no lo puede ser: esa variable es lo que
      # enciende el consumidor AUTONOMO —el que corre solo, sin implantacion delante, y
      # que por eso necesita que le digan de que municipalidad es la copia—. En este
      # compose no hay temporizador que lo dispare (arriba, en la cabecera), asi que el
      # consumidor existe solo como la ultima pasada de la implantacion, y ahi la
      # municipalidad NO se configura: es la que la implantacion acaba de dar de alta.
      # Ponerla aqui haria correr las dos cosas en el mismo proceso, que es como la
      # medicion de AC-5/AC-6 encontro H4. Para correr la pasada a mano con la
      # municipalidad ya creada, el `docker compose run -e …` de la cabecera.
    restart: "no"

  # ── El backend ──────────────────────────────────────────────────────────────
  #
  # EL SERVICIO SE LLAMA COMO EL SISTEMA, y no `aplicacion`. No es estilo: los
  # cuatro composes comparten la red `kamayuk-plataforma`, y Compose le da a cada
  # servicio un alias de red con su nombre — cuatro servicios llamados
  # `aplicacion` dejarian ese alias resolviendo a uno cualquiera de los cuatro.
  # Ademas es el nombre que la propia aplicacion da por hecho: el valor por
  # omision de `kamayuk.caja.origenes` es `http://rentas:8080/rentas/api/v1`.
  catastro:
    build:
      context: ..
      dockerfile: backend/Dockerfile
      target: aplicacion
    image: kamayuk-catastro:compose
    depends_on:
      catastro-implantacion:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: web
      KAMAYUK_DB_URL: jdbc:postgresql://base:5432/catastro
      KAMAYUK_DB_USUARIO: kamayuk_app
      KAMAYUK_DB_CLAVE: ${KAMAYUK_CLAVE_APP:?falta KAMAYUK_CLAVE_APP, sale del .env de la plataforma}
      # Sin el emisor la aplicacion se NIEGA a arrancar, y es deliberado: un
      # backend que atiende sin poder validar un token responde a la sonda, se
      # declara sano y no atiende a nadie (ADR-0005).
      #
      # Es el MISMO realm que los otros tres: un login para los cuatro
      # (ADR-0030 §3).
      KAMAYUK_OIDC_EMISOR: ${KAMAYUK_OIDC_EMISOR:-http://localhost:8180}/realms/kamayuk
      # El emisor es una identidad, no una direccion de red. El navegador llega a
      # Keycloak por su nombre publico y este contenedor por el interno de la red
      # del compose; usar el publico para las dos cosas haria que el backend
      # buscara el JWKS en si mismo y todo token seria invalido por un motivo que
      # no se parece a su causa.
      KAMAYUK_OIDC_JWKS: http://identidad:8080/realms/kamayuk/protocol/openid-connect/certs
    labels:
      # Su prefijo, y SOLO el suyo. Reclamar el de otro no falla: se lo queda, y
      # las peticiones dejan de llegar a su dueno. Es la misma prohibicion (a) que
      # `descriptor/auditoria.ts` aplica en el cluster.
      #
      # LA REGLA SE ESTRECHA A `/catastro/api/v1` Y LLEVA `priority`, y las dos
      # cosas son de #105. Desde que la interfaz se despliega, el prefijo
      # `/catastro` lo REPARTEN dos servicios, y aqui se quedo la regla ancha de
      # cuando el backend era el unico: con ella, el nginx de la interfaz no
      # recibiria nunca nada.
      #
      # La prioridad va ESCRITA y no heredada de la longitud de la regla, por lo
      # mismo que `infrastructure/src/descriptor.ts` la escribe en el cluster:
      # Traefik v3 ordena por longitud del `match` cuando nadie declara
      # `priority`, y `/catastro/api/v1` es mas larga que `/catastro`, asi que
      # saldria bien **por accidente**. Y el fallo no grita: con la precedencia al
      # reves, `/catastro/api/v1/predios` lo atenderia el nginx, cuyo
      # `try_files $uri /index.html` devuelve el `index.html` con un **200**. La
      # pantalla pide JSON y recibe HTML con codigo de exito: no un error, una
      # pagina.
      #
      # Los dos numeros son los mismos que el descriptor: 20 la API, 10 la
      # interfaz.
      - traefik.enable=true
      - traefik.http.routers.catastro.rule=PathPrefix(`/catastro/api/v1`)
      - traefik.http.routers.catastro.priority=20
      - traefik.http.services.catastro.loadbalancer.server.port=8080
    healthcheck:
      # `/actuator/health` y no `/actuator/health/liveness`: aqui esta sonda
      # alimenta `depends_on: service_healthy`, o sea «esta listo para atender», y
      # el grupo entero incluye el indicador de la base. En el cluster son tres
      # sondas distintas y la de VIDA es la del grupo `liveness` a proposito
      # (C-17, punto 2): matar el proceso no devuelve la base.
      #
      # Las tres rutas —esta y las dos del descriptor— tienen que estar entre las
      # que `SeguridadWeb` permite sin token, y eso lo comprueba
      # `sondas-contra-la-cadena` leyendo el Java. Con la cadena anterior a C-17
      # esto contestaba 401 y `curl --fail` dejaba el contenedor `unhealthy` para
      # siempre, con la aplicacion sana.
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/actuator/health || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 30s

  catastro-interfaz:
    build:
      # El contexto es `frontend/` y no la raiz, al reves que los tres de arriba:
      # este `Dockerfile` no tiene ni un `COPY` que salga de ahi, y el
      # `.dockerignore` que acota el contexto —`frontend/.dockerignore`— solo se
      # aplica desde la raiz del contexto. El de la raiz excluye `frontend/`
      # entero, asi que no dice nada de esta imagen.
      context: ../frontend
      target: interfaz
    image: kamayuk-catastro-interfaz:compose
    # EL PUERTO LLEVA EL SUFIJO DEL SISTEMA, y no es capricho.
    #
    # `KAMAYUK_PUERTO_INTERFAZ` a secas YA LO USA la interfaz del monolito, y el
    # `.env` es EL MISMO para todo esto. Reusar el nombre tendria dos efectos, los
    # dos malos: con ese `.env` delante el valor por omision de aqui NO SE
    # APLICARIA NUNCA, asi que documentar un puerto seria documentar algo falso; y
    # dos interfaces pedirian el mismo puerto del anfitrion y se pelearian por el.
    # Es lo que `caja`#39 midio.
    #
    # 8086 porque 8080 es el ingreso, 8081 la interfaz del monolito por omision,
    # 8082 la de `caja`, 8083 la de `rentas`, 8084 donde el `.env` medido desplaza
    # `KAMAYUK_PUERTO_INTERFAZ` y 8085 la de `normativa`. Censados los seis
    # composes antes de escribirlo.
    #
    # PARA QUE SIRVE, existiendo Traefik: para mirar el nginx SIN el ingreso
    # delante. Por aqui las rutas llegan con el prefijo puesto, o sea que
    # `/catastro/...` cae en el bloque que contesta 404 diciendo que falta el
    # `stripprefix` — que es exactamente lo que se quiere poder distinguir cuando
    # algo no llega.
    ports:
      - "${KAMAYUK_PUERTO_INTERFAZ_CATASTRO:-8086}:8080"
    labels:
      # La otra mitad del reparto. Prioridad MENOR que la de la API, escrita y no
      # heredada de la longitud de la regla: ver la nota del servicio `catastro`.
      #
      # Y aqui SI se quita el prefijo, porque este nginx sirve en la raiz de su
      # contenedor. Que el paquete lo pida con el prefijo puesto lo garantiza
      # `vite.config.ts` con `base: '/catastro/'` (ADR-0030 §2).
      - traefik.enable=true
      - traefik.http.routers.catastro-interfaz.rule=PathPrefix(`/catastro`)
      - traefik.http.routers.catastro-interfaz.priority=10
      - traefik.http.routers.catastro-interfaz.middlewares=catastro-quitar-prefijo
      - traefik.http.middlewares.catastro-quitar-prefijo.stripprefix.prefixes=/catastro
      - traefik.http.services.catastro-interfaz.loadbalancer.server.port=8080
    # SIN `healthcheck` aqui, y tampoco es un olvido: `frontend/Dockerfile` declara
    # el suyo —`wget --spider -q http://127.0.0.1:8080/index.html`, por 127.0.0.1 y
    # no `localhost` porque este nginx escucha solo en IPv4— y Docker aplica el
    # `HEALTHCHECK` de la imagen al contenedor, que es de donde `up --wait` lee la
    # salud. Copiarlo aqui seria un segundo sitio con la misma verdad, y el que
    # envejece sin ponerse rojo. **Ese `HEALTHCHECK` lo anade este mismo cambio**:
    # era el unico de los cuatro que no lo tenia (#105).

# La red de la plataforma, QUE YA EXISTE. `external: true` es lo que impide que
# este compose cree una segunda con el mismo nombre y deje a los servicios sin
# verse: el sintoma seria «Connection refused» a `base`, que se lee como que el
# motor no esta levantado.
networks:
  default:
    name: kamayuk-plataforma
    external: true

# Verificacion de `catastro-web`.
#
# Es lo que hay que pasar antes de un PR, y lo que hay que pasar aqui es lo
# mismo: tipos, reglas, compilacion, y las tres comprobaciones de navegador que
# sujetan las reglas por las que esta interfaz existe.
#
# <h2>Las verificaciones, y por que son estas</h2>
#
#   1. `reglas` — cada prohibicion de ESLint muerde sobre su muestra que la
#      viola. Una regla que no puede fallar no protege nada, y es la misma
#      exigencia que `ReglasDeArquitecturaMuerdenTest` impone en el backend.
#   2. `rutas` — toda ruta de `src/api/*.ts` existe como `@RequestMapping` en
#      `backend/`, y todo `acceso` de `modulos.ts` existe como `@RequiereAcceso`.
#      Es el `prosa` de este repositorio, que **no tiene OpenAPI que leer**.
#   3. `mirar` — los destinos se dibujan, sin errores de consola y sin cuerpo
#      vacio. Es la red mas ancha y la mas barata.
#   4. `sin-red` — con el proxy de datos APAGADO y todas las peticiones abortadas,
#      ninguna pantalla ensena una cifra. Es la regla que gobierna esta interfaz,
#      y mide el momento en que se rompe sin que nadie lo vea: con datos delante
#      la pantalla parece correcta siempre.
#   5. `paleta` — la paleta de comandos se opera solo con el teclado. Esta aqui
#      porque **ya se rompio una vez** en el frontend anterior y nada lo noto.
#   6. `imagen` — los dos archivos que deciden COMO SE SIRVE, `nginx.conf` y
#      `Dockerfile`, que hasta ahora no miraba nadie. Levanta nginx de verdad y
#      pregunta por HTTP.
#   7. `errores` — que lo que `cliente.ts` distingue LLEGUE a la pantalla. Rompe
#      una sola ruta con seis rechazos que comparten el mismo mensaje y exige que
#      las seis pantallas salgan DISTINTAS. Los tres defectos de #49 pasaban en
#      verde ante cualquier guarda que solo preguntara si sale un aviso: el
#      primero ensenaba datos plausibles, el segundo un boton que parecia
#      funcionar y el tercero un mensaje que parecia completo.
#   8. `transiciones` — cada fila de la cola de fiscalizacion ofrece EXACTAMENTE
#      lo que su estado admite, y ni uno mas. El dominio ya impide el atajo, asi
#      que ofrecerlo no rompe nada —el backend contesta 409— y por eso ningun
#      otro arnes lo ve: `mirar` la ve llena, `impedimentos` ve botones
#      habilitados, y `errores` mide rechazos que aqui no llegan a producirse.
#      Ejecuta ademas un acto, porque comparar una cola en reposo se cumple sola.
#   9. `territorio` — las cinco escrituras del catalogo territorial, conducidas
#      de verdad: se teclea cada campo con una marca y se mira el cuerpo que sale
#      por `fetch`, mas el JSON que vuelve contra las cifras que se pintan. Los
#      dos defectos que existe para atrapar viajan en verde por todos los demas
#      arneses: un campo que el servidor DESCARTA —el `activo` del alta, el
#      `codigo` de un `PUT`— contesta 201 sin aplicarse, y un conteo nulo pintado
#      como cero se ve exactamente igual que uno contado.
#  10. `identidad` — la PUERTA: que el `redirect_uri` con el que se vuelve del
#      emisor sea la raiz de la APLICACION —`/catastro/`— y no la del sitio. Es
#      `rentas`#71, donde ese defecto llego a produccion **con su prueba unitaria
#      en verde**: el entorno de pruebas no declaraba la misma `base` que el de
#      construccion, asi que la prueba afirmaba el valor equivocado siendo
#      coherente. Por eso esto no simula nada: compila el paquete, lo sirve y lee
#      la URL con la que el navegador se va. Y es el unico que corre SIN el emisor
#      de mentira que los demas ponen delante para llegar a las pantallas.
#  11. `ejercicios` — el desplegable de la barra global sale del RELOJ, y se mide
#      MOVIENDOLO. Es la unica forma de medirlo: los cuatro literales que #48
#      quita coinciden hoy con el reloj letra por letra, asi que una guarda que
#      pregunte «ofrece el ano en curso» pasa en verde con el defecto puesto
#      —medido: verde—, y se pondria roja sola el 1 de enero, que es avisar
#      cuando ya ha ocurrido.
#
# <h2>Por que `imagen` va en `verificar` y no en `navegador`</h2>
#
# Por tres cosas medidas, y no por costumbre:
#
#   · **No necesita nada de lo que `navegador` monta.** Ni Chromium ni `dist/`:
#     copia `nginx.conf` sobre la base de nginx y siembra una raiz de mentira, asi
#     que no depende de que `yarn build` haya corrido. Ponerlo alli le ataria una
#     comprobacion de segundos a una instalacion de navegador de minutos.
#   · **Docker entra con el, y ya esta.** Los runners `ubuntu-latest` traen Docker;
#     no hay paso nuevo de instalacion, solo la descarga de `nginx:…` —una imagen
#     alpine— la primera vez.
#   · **Lo que protege es lo que se publica.** El defecto que existe para atrapar
#     horneaba un token dentro de `assets/index-*.js`, que es el artefacto que sale
#     a `ghcr.io`. Eso pertenece al trabajo bloqueante y rapido, no al lento.
#
# Va DESPUES de `yarn build` porque es lo ultimo que se afirma del artefacto, y
# porque un fallo de tipos o de reglas se lee antes que uno de cabeceras.
#
# <h2>Por que no hace falta backend</h2>
#
# `sin-red` aborta las peticiones a proposito y las otras dos de navegador leen
# del proxy de datos, que corre dentro de la propia pagina. Eso las hace
# deterministas aqui, que es lo que un flujo bloqueante necesita.
#
# `rutas` SI necesita el arbol del backend, y lo tiene: vive en este mismo
# repositorio, y por eso `backend/**` entra en los caminos que disparan el flujo
# —una ruta que se renombra alli tiene que ponerse roja aqui—.
#
# <h2>Por que los recorridos no duermen un plazo fijo</h2>
#
# Porque medirlo dijo que era casi todo lo que el job hacia. Instrumentados los
# cuatro que recorren pantallas —`mirar`, `impedimentos`, `sin-red` y `errores`—
# antes de tocar nada: **240,5 s de esperas fijas sobre 252,9 s, el 95 %**, y las
# 222 navegaciones que se proponia ahorrar reutilizando cargas de pagina suman
# **2,7 s: el 1,1 %**. Asi que lo que se arregla es la espera, no la navegacion.
#
# `verificaciones/reposo.mjs` cambia «duerme N» por «espera HASTA N a que la
# pantalla deje de cambiar», con el plazo de antes como TOPE —el peor caso es el
# de antes, y ningun runner lento empeora—. La condicion **no es la afirmacion**:
# es que el texto de `body` no cambie y que no quede ninguna peticion en vuelo,
# nunca que salga el titulo o la cifra que despues se comprueba.
#
# `networkidle` no vale aqui y esta medido: el proxy de datos **sustituye**
# `fetch` y contesta desde la propia pagina con 120-320 ms de latencia simulada,
# asi que Chromium declara la red en reposo mientras las lecturas siguen en
# curso, y las hojas maestro-detalle encadenan una lectura tras otra.
#
# Y que esto no pierda una afirmacion lo sujetan DOS guardas. En `errores` y en
# `sin-red` leer pronto ya va al rojo solo —falta el titulo, falta el mensaje, el
# `<main>` sale mudo o anonimo—. En `impedimentos` no: alli solo baja un numero, y
# el numero **no es estable** —el mismo defecto da entre 857 y 956 controles segun
# la corrida, siempre con exit 0, donde el arbol sano dice 965—.
#
#   1. Sobre el MECANISMO: una espera que vuelve antes de poder haber observado un
#      solo intervalo de quietud saca el arnes con **2**.
#   2. Sobre el RESULTADO: en cada pantalla, despues de contar, se vigila el DOM
#      150 ms con un `MutationObserver`; si algo se movio, la espera volvio pronto,
#      y entonces se espera un plazo FIJO de 1 500 ms —que no usa el detector que
#      se juzga— y se vuelve a contar. **Se compara la espera consigo misma con mas
#      tiempo**, no contra un 965 escrito en ninguna parte.
#
# Se vigilan las 51 y no una muestra porque CUAL pantalla pierde depende de como
# caiga la carrera: una muestra de cuatro escrita a mano no cazo el defecto ni una
# vez y una de ocho derivada de la corrida lo cazo 2 de 3; con las 51, **6 de 6**.
# Y sale casi gratis porque en el arbol sano no se mueve ninguna —0 de 51—, asi que
# el margen no se paga nunca: 7,6 s, o **0,15 s por pantalla nueva**.
#
# <h2>Por que el job de navegador se cronometra a si mismo</h2>
#
# Porque `timeout-minutes` no es un presupuesto sino una guillotina: solo se
# conoce cuando se cruza, y cuando se cruza el desenlace es `cancelled` —sin
# registro, sin causa y sin nada que leer—. Medido en las cinco corridas verdes
# anteriores a #66, este job consumia **682-790 s de 900**, hasta el 88 %, y en
# el PR #64 —que ni siquiera tocaba `frontend/`— quedo cancelado. Un check
# bloqueante que a veces acaba asi ensena a **relanzar en vez de a leer**.
#
# Asi que el primer paso abre un cronometro y el ultimo lo cierra contra el
# `timeout-minutes` de este mismo archivo: avisa al 60 % y falla al 85 %, o sea
# ANTES del corte. No hay una segunda tabla de plazos escrita a mano —esa se
# queda vieja sola— ni un sistema de medicion nuevo: el reparto paso a paso ya
# lo publica Actions, y la API lo sirve en `steps[]`.
name: Frontend

on:
  pull_request:
    paths: ["frontend/**", "backend/**", ".github/workflows/frontend.yml"]
  push:
    branches: [main]
    paths: ["frontend/**", "backend/**", ".github/workflows/frontend.yml"]

# Sin permisos de escritura: este trabajo lee y verifica, no publica nada.
permissions:
  contents: read

jobs:
  verificar:
    name: Tipos, reglas y compilacion
    runs-on: ubuntu-latest
    # Un colgado no consume cuota sin limite.
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      # La version sale de `frontend/.nvmrc` y NO de un literal aqui: con el
      # literal, CI y quien clona el repositorio son dos numeros que pueden
      # separarse sin que nada lo diga, y separarse es lo que hacen. Asi la
      # incoherencia no se puede escribir.
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Instalar dependencias
        run: yarn install --frozen-lockfile

      - name: Tipos
        run: yarn verificar

      - name: Las prohibiciones se cumplen
        run: yarn lint

      # Va DESPUES del install a proposito: si `.nvmrc` y `engines` se
      # desincronizan, yarn ya habra fallado antes con el mensaje que nombra las
      # dos versiones, y esto solo tiene que cazar el caso en que la version
      # instalada las cumple y aun asi no es la que vite admite.
      #
      # `motor` y no `node`, y no es cosmetica: este paso decia `yarn node`, que
      # **no es el guion** sino el comando `node` de yarn 1 —arranca Node y sale—.
      # Medido: imprimia «yarn node v1.22.22 · Done in 0.04s» y salia con 0 sin
      # ejecutar una linea del arnes, asi que este paso llevaba en verde desde que
      # existe sin haber comprobado nada. Lo vigila el propio arnes: ningun guion
      # de `package.json` puede llamarse como un comando de yarn.
      - name: La version de Node dice lo mismo en los dos sitios
        run: yarn motor

      # No abre navegador: linta las muestras como texto.
      - name: Cada prohibicion muerde sobre su muestra
        run: yarn reglas

      # Tampoco: lee el fuente del frontend y el `backend/` de este mismo clon.
      - name: Lo que esta interfaz dice del backend sigue siendo verdad
        run: yarn rutas

      # Tampoco: lee `src/datos/` y falla ante cualquier numero que no sea una
      # referencia. Es la mitad temprana de `sin-red`: esa caza la cifra que
      # llega a la pantalla, y esta la caza cuando se escribe.
      - name: En «src/datos» no hay ni una cifra
        run: yarn datos

      - name: Compilar para produccion
        run: yarn build

      # Levanta `nginx.conf` sobre la base que el propio `Dockerfile` nombra y
      # pregunta POR HTTP. No construye la imagen del frontend a proposito: son
      # segundos, y asi la comprobacion no depende del paso de arriba.
      #
      # Sin Docker sale con 2, no se omite. En un runner `ubuntu-latest` Docker
      # esta, asi que el 2 aqui significa que algo se rompio de verdad.
      - name: Las cabeceras llegan, y nada que git no vea entra en la imagen
        run: yarn imagen

  navegador:
    name: Los destinos, en un navegador de verdad
    runs-on: ubuntu-latest
    # Este numero NO es decorativo y no se sube para ganar meses: es el
    # presupuesto que el primer y el ultimo paso del job miden contra el reloj.
    # Bajo de 15 a 10 porque el job paso de 785 s a ~240 s al arreglar el
    # recorrido de `sin-red` (#66), y un tope tres veces mayor que la duracion
    # real no avisa de nada: la alarma solo sonaria despues de una regresion del
    # 200 %.
    #
    # Con #86 el job baja de 356 s a 229 s —38 % de este tope, medido en CI— y
    # **el 10 se queda**, con su aritmetica y no por inercia. Lo que decide si
    # una alarma sirve no es cuantas veces cabe la duracion actual sino **cuantas
    # pantallas faltan para que suene**, y esa pendiente es lo que #86 cambio:
    # medida en esta misma corrida, una pantalla nueva cuesta 1,65 s en los tres
    # recorridos (25+28+31 s / 51) y una superficie de error 5,1 s (51 s / 10),
    # contra los 6,6 s por pantalla de antes. Asi que los 131 s que quedan hasta
    # el aviso —el 60 % son 360 s— son ~79 pantallas o ~25 superficies de error,
    # cuando en la corrida anterior eran **4 s: media pantalla**. Bajarlo ahora
    # se gastaria en la alarma justo el margen que este trabajo existe para dar
    # a los cinco issues de pantalla en cola.
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      # El primero que ejecuta algo, y no por gusto: lo que quede por delante no
      # entra en el presupuesto. Lo comprueba `cerrar` leyendo este mismo
      # archivo, y sale con 2 —«no se pudo comprobar»— si dejara de serlo.
      #
      # Corre con el Node del runner porque `setup-node` todavia no ha pasado:
      # solo usa `node:fs`, `node:os` y `node:path`.
      - name: Abrir el presupuesto de reloj
        run: node verificaciones/presupuesto.mjs abrir navegador

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Instalar dependencias
        run: yarn install --frozen-lockfile

      - name: Instalar Chromium
        run: npx playwright-core install --with-deps chromium

      - name: Compilar y servir
        run: |
          yarn build
          npx vite preview --port 5210 --strictPort &
          # Sin `wait-on`: es una dependencia mas que descargar para hacer lo que
          # hacen tres lineas, y en un flujo bloqueante cada descarga es una forma
          # nueva de ponerse rojo por algo que no se esta midiendo.
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:5210/ && break
            sleep 1
          done
          curl -sf -o /dev/null http://localhost:5210/

      - name: Los destinos se dibujan
        run: CATASTRO_BASE=http://localhost:5210 node verificaciones/mirar.mjs

      - name: La paleta se opera con el teclado
        run: CATASTRO_BASE=http://localhost:5210 node verificaciones/paleta.mjs

      # Un boton apagado es la unica pieza que no puede explicarse a si misma:
      # no se puede pulsar, asi que no hay como averiguar que le falta. Y desde
      # #71 tambien los que quedan CORTADOS por el borde a la anchura del
      # artboard, que estan un escalon por debajo: no se pueden pulsar Y no se
      # pueden ver, asi que quien mira no concluye nada. Ocurrio de verdad —la
      # tabla de hallazgos con diez columnas dejaba «Adjuntar evidencia» fuera— y
      # no lo veia ningun arnes, porque el control no esta impedido.
      - name: Ningun control impedido sin decir por que, y ninguno cortado por el borde
        run: CATASTRO_BASE=http://localhost:5210 node verificaciones/impedimentos.mjs

      # Corre contra la MISMA vista previa que `mirar`, con el proxy de datos
      # encendido: rompe una sola ruta y deja que el proxy conteste el resto en
      # 200, que es el caso que importa —un usuario con `aranceles` y sin
      # `calles`—. Con la red cortada entera, las tres superficies de #49 no se
      # distinguen de las 26 que si pasan por `Fallo`.
      - name: Un 403, un 500 y un 422 producen pantallas distintas
        run: CATASTRO_BASE=http://localhost:5210 node verificaciones/errores.mjs

      # Mueve el reloj del navegador a dos anos que no son este y mira que
      # ofrece el desplegable y —sobre todo— que ano VIAJA en `?ejercicio=`. Sin
      # mover el reloj no mide nada: los cuatro literales que #48 quita coinciden
      # hoy con el, y el arnes sale con 2 si detecta que no se movio.
      - name: El desplegable de ejercicios sale del reloj
        run: CATASTRO_BASE=http://localhost:5210 node verificaciones/ejercicios.mjs

      # Compara lo que la ficha DIBUJA con el JSON que la pagina recibio, en las
      # cuatro clases. Dos cosas que se ven igual de bien cuando estan mal: una
      # obra complementaria no tiene valor que ensenar —el Anexo III no esta
      # transcrito y `otra_instalacion` no tiene columna de importe—, asi que
      # cualquier cifra de mas en esa seccion esta inventada; y `historico` viaja
      # solo con `?historico=true`, que ninguna pantalla ensena.
      - name: La ficha dibuja lo que la respuesta trae, y dice lo que no existe
        run: CATASTRO_BASE=http://localhost:5210 node verificaciones/ficha.mjs

      # Fila a fila: lo que la pantalla OFRECE contra lo que el estado de esa fila
      # admite. El dominio ya impide el atajo —`Candidato.verificadoEnCampo()`
      # exige venir de gabinete—, asi que ofrecerlo no rompe nada: contesta 409.
      # Por eso no lo ve ningun otro arnes, y por eso hace falta este: una
      # pantalla que ofrece un camino que no existe manda a concluir que el
      # sistema esta roto. Y ejecuta un acto, porque con la cola congelada «lo
      # ofrecido cuadra con el estado» se cumple sola para siempre.
      - name: Cada fila ofrece lo que su estado admite, y el ciclo avanza
        run: CATASTRO_BASE=http://localhost:5210 node verificaciones/transiciones.mjs

      # Conduce las cinco escrituras del catalogo territorial y mira LO QUE
      # VIAJA y LO QUE VUELVE, no lo que la pantalla dibuja: el `activo` del alta
      # de un sector y el `codigo` del cuerpo de un `PUT` estan en el `record`
      # —asi que `rutas` los da por buenos, y con razon: viajan— y el controlador
      # los lee y los TIRA. Un control asi no da error, no da aviso, el servidor
      # contesta 201, y el dato no acaba en ningun sitio. Ademas exige que toda
      # cifra del panel de resultado venga del JSON: los conteos llegan NULOS en
      # las respuestas de escritura, y un cero ahi se pinta igual que uno leido.
      - name: Lo que se teclea en el catalogo llega entero, y ningun conteo se inventa
        run: CATASTRO_BASE=http://localhost:5210 node verificaciones/territorio.mjs

      # Compila su PROPIA vista previa con la bandera apagada y la sirve en otro
      # puerto: el proxy se apaga al compilar —Vite resuelve `import.meta.env`
      # entonces—, asi que correrlo contra la vista previa de arriba mediria el
      # paquete equivocado y pasaria en verde sin haber apagado nada.
      - name: Con el proxy apagado, ninguna pantalla ensena una cifra
        run: node verificaciones/sin-red.mjs

      # Compila su PROPIA vista previa —con el proxy de datos apagado, que es como
      # se construye la imagen— y **sin emisor de mentira delante**: los nueve
      # arneses de arriba ponen uno para poder llegar a las pantallas, y este es el
      # unico que mide la puerta. Lee la URL con la que la aplicacion se va a
      # Keycloak y afirma el `redirect_uri`, el reto S256 y donde NO esta el token.
      #
      # No usa `CATASTRO_BASE`: se sirve a si mismo en otro puerto, porque el
      # paquete que mide no es el de arriba.
      - name: La puerta de identidad vuelve a la raiz de la APLICACION
        run: yarn identidad

      # El ultimo que ejecuta algo, por lo mismo: lo que quede detras no se
      # contaria. Avisa al 60 % del tope y falla al 85 %, o sea ANTES de que la
      # guillotina de `timeout-minutes` deje un `cancelled` sin causa que leer.
      - name: El job no va justo de tiempo
        run: node verificaciones/presupuesto.mjs cerrar

      - name: Publicar las capturas de lo que fallara
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-del-navegador
          path: frontend/.capturas/
          retention-days: 7
